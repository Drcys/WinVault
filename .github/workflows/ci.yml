name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest     # oldest supported Python, core only
            python: "3.10"
            extras: "dev"
          - os: windows-latest    # target platform, incl. the desktop app (headless)
            python: "3.12"
            extras: "dev,gui"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest -q

  # GitHub's Windows runners are elevated, so this exercises every live
  # collector end-to-end: baseline -> harmless test changes -> compare.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Enable auditing
        run: .\scripts\Enable-WinVaultAuditing.ps1
      - name: Baseline
        run: winvault --store "$env:RUNNER_TEMP\wv" baseline --label ci
      - name: Make test changes
        run: .\scripts\Test-WinVaultChanges.ps1
      - name: Compare
        run: winvault --store "$env:RUNNER_TEMP\wv" compare --json "$env:RUNNER_TEMP\report.json" --html "$env:RUNNER_TEMP\report.html" --show 30 --timeline
      - name: Assert detections
        shell: python
        run: |
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "report.json")))
          keys = {(c["category"], c["status"]): [] for c in r["changes"]}
          for c in r["changes"]:
              keys[(c["category"], c["status"])].append(c["key"])
          def hit(cat, status, needle):
              assert any(needle.lower() in k.lower() for k in keys.get((cat, status), [])), (cat, status, needle)
          hit("registry", "added", "WinVaultTest")
          hit("services", "added", "WinVaultTestSvc")
          hit("tasks", "added", "WinVaultTest")
          hit("startup", "added", "WinVaultTest.txt")
          assert any(c["category"] == "users" and c["status"] == "added" and c["after"]["name"] == "wv_testuser"
                     and c["after"]["is_admin"] for c in r["changes"])
          print("all 5 collectors detected their test change")

          # Phase 2: the new admin user must score critical, and every test
          # artifact must be scored as signal, never filtered as noise.
          admin = next(c for c in r["changes"] if c["category"] == "users"
                       and (c.get("after") or {}).get("name") == "wv_testuser")
          assert admin["analysis"]["level"] == "critical", admin["analysis"]
          for c in r["changes"]:
              if "WinVaultTest" in c["key"] or (c.get("after") or {}).get("name") == "wv_testuser":
                  assert c["analysis"]["noise"] is None, ("test artifact wrongly filtered", c["key"])
          print("scoring flags the new admin user critical and keeps all test artifacts as signal")

          # Phase 3: each change is tied to the audit event that names it.
          def ev_ids(change):
              return {e["event_id"] for e in change["correlation"]["evidence"]}
          svc = next(c for c in r["changes"] if c["key"] == "WinVaultTestSvc")
          assert 7045 in ev_ids(svc), svc["correlation"]
          assert svc["correlation"]["attribution"]["confidence"] in ("high", "medium")
          assert 4720 in ev_ids(admin), admin["correlation"]
          group = next(c for c in r["changes"] if c["key"] == "group:S-1-5-32-544")
          assert 4732 in ev_ids(group), group["correlation"]
          task = next(c for c in r["changes"] if c["key"] == "\\WinVaultTest")
          assert ev_ids(task) & {4698, 106}, task["correlation"]
          assert not r["alerts"], r["alerts"]
          print("service, user, group and task are each tied to their audit event")

          # Phase 5: critical files were hashed and the HTML report was written.
          assert "files" in r["summary"], r["summary"].keys()
          html = open(os.path.join(os.environ["RUNNER_TEMP"], "report.html"), encoding="utf-8").read()
          assert "wv_testuser" in html and "Timeline" in html
          print("critical files hashed and HTML report generated")

          # v1.2: firewall, Defender, policy, software and system collectors.
          def note(msg):
              print(f"::notice title=WinVault v1.2::{msg}")
          for cat in ("firewall", "defender", "policy", "software", "system"):
              s = r["summary"].get(cat)
              note(f"collector {cat}: " + (str(s) if s else "not compared"))
          for w in r["warnings"]:
              note(f"warning: {w[:180]}")
          hit("firewall", "added", "WinVaultTest")
          hit("software", "added", "WinVaultTest")
          hit("system", "added", "winvaulttest.exe")
          assert "policy" in r["summary"], r["summary"].keys()
          def find(cat, needle):
              return next(c for c in r["changes"] if c["category"] == cat and needle.lower() in c["key"].lower())
          fw, sw, ifeo = find("firewall", "WinVaultTest"), find("software", "WinVaultTest"), find("system", "winvaulttest.exe")
          for c in (fw, sw, ifeo):
              assert c["analysis"]["noise"] is None, ("test artifact wrongly filtered", c["key"])
              note(f"{c['category']} {c['key']}: {c['analysis']['level']} {c['analysis']['score']} "
                   f"{c['analysis']['reasons']} evidence={sorted(ev_ids(c))} "
                   f"confidence={(c['correlation']['attribution'] or {}).get('confidence')}")
          assert fw["analysis"]["level"] == "medium" and fw["analysis"]["score"] == 50, fw["analysis"]  # 30 rule + 20 port 4444
          assert ifeo["analysis"]["level"] == "high", ifeo["analysis"]
          if "defender" in r["summary"]:
              d = find("defender", "winvaulttest")
              note(f"defender {d['key']}: {d['analysis']['level']} {d['analysis']['score']} evidence={sorted(ev_ids(d))}")
              assert d["analysis"]["level"] in ("high", "critical"), d["analysis"]
          print("v1.2 collectors detected their test changes")
      - name: Cleanup
        if: always()
        run: .\scripts\Test-WinVaultChanges.ps1 -Cleanup
